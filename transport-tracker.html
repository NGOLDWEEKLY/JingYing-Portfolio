<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transport Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .grid-button {
            width: 100%;
            height: 150px;
            font-size: 1.5rem;
        }

        .nav-tabs {
            margin-bottom: 20px;
        }

        .history-icon {
            position: fixed;
            top: 10px;
            right: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>


    <div class="container">
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link active" id="go-tab" href="#go" data-bs-toggle="tab">Go</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="back-tab" href="#back" data-bs-toggle="tab">Back</a>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="go">
                <div class="row g-2">
                </div>
            </div>
            <div class="tab-pane fade" id="back">
                <div class="row g-2">

                </div>
            </div>
        </div>

        <span class="history-icon" data-bs-toggle="modal" data-bs-target="#logModal" onclick="showHistory()">🕒</span>
    </div>


    <!-- Modal -->
    <div class="modal fade" id="logModal" tabindex="-1" aria-labelledby="logModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="logModalLabel">Transport Logs</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive" style="max-height: 400px;">
                        <table class="table table-hover table-bordered">
                            <thead class="table-secondary">
                                <tr>
                                    <th scope="col">Name</th>
                                    <th scope="col">Category</th>
                                    <th scope="col">Time</th>
                                </tr>
                            </thead>
                            <tbody id="logTableBody">
                                <!-- Dynamic content will be inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function recordClick(button) {
            const buttonId = button.id;
            const buttonCat = button.getAttribute("category");
            const buttonName = button.name;
            const timestamp = new Date().toISOString();
            button.classList.remove('btn-warning');
            button.classList.add('btn-success');
            button.disabled = true;

            let records = JSON.parse(localStorage.getItem('records')) || {};
            const today = new Date().toISOString().split('T')[0];

            if (!records[today]) {
                records[today] = [];
            }

            records[today].push({ id: buttonId, name: buttonName, category: buttonCat, time: timestamp });
            localStorage.setItem('records', JSON.stringify(records));
        }

        function showHistory() {
            let records = JSON.parse(localStorage.getItem('records')) || {};
            console.log(records);


            // Function to convert ISO time to a more readable format
            function formatTime(isoString) {
                const date = new Date(isoString);
                return date.toLocaleString();
            }

            // Populate the table with data
            const tableBody = document.getElementById('logTableBody');
            document.getElementById('logTableBody').innerHTML = "";
            for (const date in records) {
                records[date].forEach(log => {
                    const row = document.createElement('tr');

                    const nameCell = document.createElement('td');
                    nameCell.textContent = log.name;
                    row.appendChild(nameCell);

                    const categoryCell = document.createElement('td');
                    categoryCell.textContent = log.category;
                    row.appendChild(categoryCell);

                    const timeCell = document.createElement('td');
                    timeCell.textContent = formatTime(log.time);
                    row.appendChild(timeCell);

                    tableBody.appendChild(row);
                });
            }
        }

        function initPage() {
            const locationItemsJSON = localStorage.getItem('locationItems');
            if (locationItemsJSON !== null) {
                var goButtonsHTML = "";
                var backButtonsHTML = "";
                const locationItems = JSON.parse(locationItemsJSON);
                locationItems['go'].forEach(item => {
                    goButtonsHTML += `
                <div class="col-6">
                        <button class="btn btn-warning grid-button" id="${item.id}" name="${item.name}" category="go" onclick="recordClick(this)">${item.name}</button>
                    </div>
                `
                });
                document.getElementById('go').getElementsByTagName('div')[0].innerHTML = goButtonsHTML;
                locationItems['back'].forEach(item => {
                    backButtonsHTML += `
                <div class="col-6">
                        <button class="btn btn-warning grid-button" id="${item.id}" name="${item.name}" category="back" onclick="recordClick(this)">${item.name}</button>
                    </div>
                `
                });
                document.getElementById('back').getElementsByTagName('div')[0].innerHTML = backButtonsHTML;
            } else {
                const locationItemsJSON = window.prompt("enter JSON");
                localStorage.setItem('locationItems', locationItemsJSON);
            }

            const lastVisit = localStorage.getItem('lastVisit');
            const today = new Date().toISOString().split('T')[0];

            if (lastVisit !== today) {
                localStorage.setItem('lastVisit', today);
                document.querySelectorAll('.grid-button').forEach(button => {
                    button.classList.remove('btn-success');
                    button.classList.add('btn-warning');
                    button.disabled = false;
                });
            } else {
                let records = JSON.parse(localStorage.getItem('records')) || {};
                if (records[today]) {
                    records[today].forEach(event => {
                        const button = document.getElementById(event.id);
                        if (button) {
                            button.classList.remove('btn-warning');
                            button.classList.add('btn-success');
                            button.disabled = true;
                        }
                    });
                }
            }
        }

        initPage();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.7/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>

</html>
